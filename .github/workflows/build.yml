name: Build Town Gossip Board

on:
    push:
        branches:
            - master
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            # 1. Checkout code
            - name: Checkout code
              uses: actions/checkout@v3

            # 2. Install Bun
            - name: Install Bun
              run: |
                  curl -fsSL https://bun.sh/install | bash
                  echo "$HOME/.bun/bin" >> $GITHUB_PATH

            # 3. Install dependencies
            - name: Install dependencies
              run: bun install

            # 4. Build project
            - name: Build project
              run: bun run build

            # 5. List dist files
            - name: List dist files
              run: ls -l ./dist

            # 6. Upload artifact
            - name: Upload dist as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: town-gossip-board-dist
                  path: ./dist
