name: Build Town Gossip Board

on:
    push:
        branches:
            - master
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Install Bun
              run: |
                  curl -fsSL https://bun.sh/install | bash
                  export PATH="$HOME/.bun/bin:$PATH"

            - name: Install dependencies
              run: bun install

            - name: Build project
              run: bun run build

            - name: List dist files
              run: ls -l ./dist

            - name: Upload dist as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: town-gossip-board-dist
                  path: ./dist
